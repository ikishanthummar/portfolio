<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <script>
      // the site always opens on the black hole; themes picked during a visit aren't remembered.
      // clear what older versions saved
      try {
        localStorage.removeItem('theme')
      } catch (e) {}
    </script>
    <title>Kishan Thummar | Full Stack Developer</title>
    <meta name="description" content="Kishan Thummar, Full Stack Developer with 6+ years building secure payment platforms, CRMs and real-time systems with .NET, Angular, React and SQL Server." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- social preview (LinkedIn, WhatsApp, X). Needs absolute URLs, see VITE_SITE_URL in .env -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Kishan Thummar | Full Stack Developer" />
    <meta property="og:description" content="Full Stack Developer with 6+ years building secure payment platforms, CRMs and real-time systems with .NET, Angular, React and SQL Server." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kishan Thummar, Full Stack Developer, in front of the black hole Gargantua" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kishan Thummar | Full Stack Developer" />
    <meta name="twitter:description" content="Secure payment platforms, CRMs and real-time systems with .NET, Angular and React." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>
